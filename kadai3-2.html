<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宝箱当てゲーム</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/projapayuri/aframe-gesture-hands@v0.9.2/aframe-gesture-hands.js"></script>
<style>body{margin:0;overflow:hidden;}</style>
</head>
<body>
<a-scene id="scene" hands renderer="alpha: true" xr-mode-ui="enabled: false">
<a-entity hand-skeleton></a-entity>
<a-text value="TREASURE GAME" position="-1.1 1.7 -3" color="yellow" width="5"></a-text>

<a-entity id="chest1" position="-1 0 -3">
<a-box 
position="0 0 0" 
width="0.75" 
height="0.5" 
depth="0.55" 
color="#713b18"
></a-box>
<a-box
id="lid1"
position="0 0.3 0" 
width="0.8" 
height="0.18" 
depth="0.6" 
color="#a5662d"
></a-box>
<a-box 
position="0 0 0.29" 
width="0.08" 
height="0.5" 
depth="0.03" 
color="gold"
></a-box>
<a-box
position="0 0.05 0.32" 
width="0.16" 
height="0.2" 
depth="0.05" 
color="gold"
></a-box>
<a-sphere
id="coin1" 
position="0 0.5 0" 
radius="0.12" 
color="gold" 
visible="false"
></a-sphere>
</a-entity>

<a-entity id="chest2" position="0 0 -3">
<a-box position="0 0 0" width="0.75" height="0.5" depth="0.55" color="#713b18"></a-box>
<a-box id="lid2" position="0 0.3 0" width="0.8" height="0.18" depth="0.6" color="#a5662d"></a-box>
<a-box position="0 0 0.29" width="0.08" height="0.5" depth="0.03" color="gold"></a-box>
<a-box position="0 0.05 0.32" width="0.16" height="0.2" depth="0.05" color="gold"></a-box>
<a-sphere id="coin2" position="0 0.5 0" radius="0.12" color="gold" visible="false"></a-sphere>
</a-entity>

<a-entity id="chest3" position="1 0 -3">
<a-box position="0 0 0" width="0.75" height="0.5" depth="0.55" color="#713b18"></a-box>
<a-box id="lid3" position="0 0.3 0" width="0.8" height="0.18" depth="0.6" color="#a5662d"></a-box>
<a-box position="0 0 0.29" width="0.08" height="0.5" depth="0.03" color="gold"></a-box>
<a-box position="0 0.05 0.32" width="0.16" height="0.2" depth="0.05" color="gold"></a-box>
<a-sphere id="coin3" position="0 0.5 0" radius="0.12" color="gold" visible="false"></a-sphere>
</a-entity>
<a-text id="result" value="人差し指で宝箱を選んでね！" position="-1.5 -0.8 -3" color="white" width="5"></a-text>
<a-camera position="0 0 0" look-controls="enabled: false" wasd-controls="enabled: false"></a-camera>
</a-scene>
<script>

const scene=document.querySelector("#scene");
const chests=[document.querySelector("#chest1"),document.querySelector("#chest2"),document.querySelector("#chest3")];
const lids=[document.querySelector("#lid1"),document.querySelector("#lid2"),document.querySelector("#lid3")];
const coins=[document.querySelector("#coin1"),document.querySelector("#coin2"),document.querySelector("#coin3")];
const result=document.querySelector("#result");

let answer=Math.floor(Math.random()*3);
let finished=false;
let waitingForLeave=false;

function checkGame(){
const hands=scene.components.hands;
if(!hands||typeof hands.isPointOnEntity!=="function"){
  requestAnimationFrame(checkGame);
  return;
}
const hits=chests.map(chest=>hands.isPointOnEntity(8,chest));
const touching=hits.some(hit=>hit);
  if(waitingForLeave){if(!touching){
    waitingForLeave=false;result.setAttribute("value","もう一度選んでね！");
  }
  requestAnimationFrame(checkGame);return;
}
  if(!finished&&touching){
    const selected=hits.indexOf(true);
    finished=true;
    if(selected===answer){
    result.setAttribute("value","大当たり！！");
    result.setAttribute("color","yellow");
    lids[selected].setAttribute("animation",{
      property:"position",to:"0 0.8 0",dur:500,easing:"easeOutBack"
    });
  coins[selected].setAttribute("visible",true);
  coins[selected].setAttribute("animation",{property:"position",to:"0 1.5 0",dur:700,easing:"easeOutQuad"});
  chests[selected].setAttribute("animation__win",{property:"scale",to:"1.15 1.15 1.15",dur:250,dir:"alternate",loop:3});
    }else{
    result.setAttribute("value","残念！はずれ！");
    result.setAttribute("color","red");
    chests[selected].setAttribute("animation__lose",{
      property:"rotation",from:"0 0 -5",to:"0 0 5",dur:100,dir:"alternate",loop:4
    });
    chests[selected].setAttribute("color","red");
    }
setTimeout(()=>{
chests.forEach(chest=>{chest.setAttribute("scale","1 1 1");chest.removeAttribute("animation__win");chest.removeAttribute("animation__lose");chest.setAttribute("rotation","0 0 0");});
lids.forEach(lid=>{lid.removeAttribute("animation");lid.setAttribute("position","0 0.3 0");});
coins.forEach(coin=>{coin.setAttribute("visible",false);coin.removeAttribute("animation");coin.setAttribute("position","0 0.5 0");});
chests.forEach((chest,i)=>{chest.querySelectorAll("a-box")[0].setAttribute("color","#713b18");});
answer=Math.floor(Math.random()*3);
result.setAttribute("value","手を離してもう一度！");
result.setAttribute("color","white");
waitingForLeave=true;
finished=false;
},2000);
}

requestAnimationFrame(checkGame);

}

scene.addEventListener("loaded",()=>checkGame());
</script>
</body>
</html>
