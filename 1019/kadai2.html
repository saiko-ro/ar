<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SWAT AR</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
<style>
        #hud {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 999;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-width: calc(100% - 30px);
        }
        button, select {
            font-size: 17px;
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
        }
        button {
            background-color: royalblue;
            color: white;
        }
        button:active {
            background-color: navy;
        }
        select {
            background-color: white;
            color: black;
        }
</style>
</head>
<body>
<div id="hud">
<select id="animationSelect">
<option value="Walk">歩く</option>
<option value="Run">走る</option>
</select>
<button id="enlargeButton">拡大</button>
<button id="shrinkButton">縮小</button>
<button id="rotateButton">回転</button>
<button id="reverseRotateButton">逆回転</button>
</div>
<a-scene
        embedded
        vr-mode-ui="enabled: false"
        renderer="colorManagement: true"
        arjs="sourceType: webcam; debugUIEnabled: false;">
<a-marker preset="hiro" smooth="true">
<a-entity
                id="model"
                position="0 0 0"
                rotation="0 0 0"
                scale="1 1 1">
<a-gltf-model
                    id="swat"
                    src="./SWAT.glb"
                    position="0 0 0"
                    rotation="-90 0 0"
                    scale="0.3 0.3 0.3"
                    animation-mixer="clip: Walk; loop: repeat; timeScale: 1">
</a-gltf-model>
</a-entity>
</a-marker>
<a-entity camera></a-entity>
</a-scene>
<script>

        const swat = document.getElementById("swat");
        const model = document.getElementById("model");
        const animationSelect = document.getElementById("animationSelect");
        const enlargeButton = document.getElementById("enlargeButton");
        const shrinkButton = document.getElementById("shrinkButton");
        const rotateButton = document.getElementById("rotateButton");
        const reverseRotateButton =
            document.getElementById("reverseRotateButton");
        let size = 1;
        let angle = 0;

        function enlargeModel() {
            size = Math.min(3, size + 0.1);
            model.setAttribute("scale", `${size} ${size} ${size}`);
        }

        function shrinkModel() {
            size = Math.max(0.1, size - 0.1);
            model.setAttribute("scale", `${size} ${size} ${size}`);
        }

        function rotateModel() {
            angle += 15;
            model.setAttribute("rotation", `0 ${angle} 0`);
        }

        function reverseRotateModel() {
            angle -= 15;
            model.setAttribute("rotation", `0 ${angle} 0`);
        }
        function changeAnimation() {
            const clipName = animationSelect.value;

            swat.setAttribute("animation-mixer", {
                clip: clipName,
                loop: "repeat",
                timeScale: 1
            });
        }
        enlargeButton.addEventListener("click", enlargeModel);
        shrinkButton.addEventListener("click", shrinkModel);
        rotateButton.addEventListener("click", rotateModel);
        reverseRotateButton.addEventListener("click", reverseRotateModel);
        animationSelect.addEventListener("change", changeAnimation);
        swat.addEventListener("model-loaded", function () {
            const animations =
                swat.components["gltf-model"].model.animations;
            console.log("SWAT.glb の読み込みが完了しました");
            console.log(
                "アニメーション名:",
                animations.map(animation => animation.name)
            );
        });
</script>
</body>
</html>
